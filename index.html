<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#26301f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pilzfarm">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Pilzfarm – Clicker</title>
<style>
:root{--bg:#f1ede2;--surface:#e4ddcb;--ink:#26301f;--muted:#6b6f58;--accent:#b4432c;--ok:#3f6b35;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171d14;--surface:#232c1f;--ink:#ece6d3;--muted:#9aa085;--accent:#e2705a;--ok:#8fc27f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171d14;--surface:#232c1f;--ink:#ece6d3;--muted:#9aa085;--accent:#e2705a;--ok:#8fc27f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif;min-height:100vh}
main{max-width:880px;margin:0 auto;padding:20px 16px 40px;display:grid;gap:20px;grid-template-columns:1fr}
@media(min-width:760px){main{grid-template-columns:1fr 1fr;align-items:start}}
h1{font-family:Georgia,"Times New Roman",serif;font-size:2rem;margin:0 0 4px}
.stage{text-align:center;position:relative;user-select:none}
.count{font-family:Georgia,serif;font-size:3rem;font-weight:700;line-height:1.1}
.rate{color:var(--muted);margin:2px 0 14px}
#pilz{width:min(260px,70vw);aspect-ratio:1;border:0;background:none;cursor:pointer;padding:0;transition:transform .08s}
#pilz:active{transform:scale(.93)}
#pilz:focus-visible{outline:3px solid var(--accent);outline-offset:6px;border-radius:50%}
.pop{position:absolute;pointer-events:none;font-weight:700;color:var(--ok);animation:up .8s ease-out forwards}
@keyframes up{0%{transform:translate(-50%,12px) scale(.3) rotate(var(--rot,0deg));opacity:0}18%{transform:translate(-50%,-14px) scale(1.4) rotate(var(--rot,0deg));opacity:1}32%{transform:translate(-50%,-24px) scale(1) rotate(0deg);opacity:1}100%{transform:translate(calc(-50% + var(--dx,0px)),-105px) scale(.85);opacity:0}}
.pop{font-family:Georgia,serif;font-size:1.6rem;color:#fff6d6;-webkit-text-stroke:5px #2f5a28;paint-order:stroke fill;text-shadow:0 4px 10px rgba(0,0,0,.35);white-space:nowrap;z-index:6;animation:up 1s cubic-bezier(.2,.8,.3,1) forwards}
.pop.crit{font-size:2.4rem;color:#ffe27a;-webkit-text-stroke:6px #9a4f0a;text-shadow:0 0 18px #ffb000,0 4px 12px rgba(0,0,0,.4)}
@media(prefers-reduced-motion:reduce){.pop{animation:fade 1s forwards;transform:translateX(-50%)}@keyframes fade{0%,70%{opacity:1}100%{opacity:0}}}
.shop{display:grid;gap:10px}
.shop h2{margin:0;font-family:Georgia,serif;font-size:1.3rem}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;width:100%;padding:12px 14px;background:var(--surface);color:var(--ink);border:2px solid transparent;border-radius:10px;font:inherit;cursor:pointer}
.item:disabled{opacity:.5;cursor:not-allowed}
.item:not(:disabled):hover{border-color:var(--ok)}
.item:focus-visible{outline:3px solid var(--accent)}
.item b{display:block}.item small{color:var(--muted)}
.cost{font-weight:700;white-space:nowrap}
.own{font-family:Georgia,serif;font-size:1.4rem;color:var(--muted)}
.reset{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;justify-self:start}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
.pop{font-size:1.2rem;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.pop.crit{color:#e8b923;font-size:1.9rem}
.mute{position:absolute;top:0;right:0;background:var(--surface);border:0;border-radius:8px;font-size:1.2rem;padding:6px 10px;cursor:pointer}
.mute:focus-visible{outline:3px solid var(--accent)}
.count.bump{animation:bump .15s}
#pilz svg{transition:filter .4s}
@keyframes float{50%{transform:translateY(-7px) scale(1.025,.98)}}
.item{transition:transform .12s,border-color .12s,opacity .2s}
.item:not(:disabled):active{transform:scale(.97)}
@keyframes ready{0%{transform:scale(.96)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){#pilz svg,.item:not(:disabled){animation:none}}
body{background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--ok) 20%,var(--bg)),var(--bg) 65%) no-repeat fixed;background-color:var(--bg)}
.stage{background:var(--surface);border-radius:20px;padding:20px 16px 24px;border:1px solid color-mix(in srgb,var(--ink) 12%,transparent)}
.mute{top:12px;right:12px;background:var(--bg)}
.stats{display:flex;justify-content:center;gap:10px;margin:0 0 14px}
.stats div{background:var(--bg);border-radius:10px;padding:6px 12px;min-width:84px}
.stats b{display:block;font-size:1.05rem}.stats small{color:var(--muted);font-size:.75rem}
.item{display:grid;grid-template-columns:2.4rem 1fr auto;align-items:center;background:linear-gradient(90deg,color-mix(in srgb,var(--ok) 24%,var(--surface)) var(--p,0%),var(--surface) var(--p,0%))}
.item:disabled{opacity:.8}
.item.locked{opacity:.45;background:var(--surface)}
.ic{font-size:1.6rem;text-align:center}
.rt{display:flex;flex-direction:column;align-items:flex-end}
.own{font-size:1rem;color:var(--muted)}
.shop h2{display:flex;justify-content:space-between}
.stagelbl{color:var(--muted);font-size:.85rem;margin-bottom:4px}
[hidden]{display:none!important}
.tabs{display:flex;gap:6px;background:var(--surface);padding:4px;border-radius:12px}
.tab{flex:1;border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:8px;border-radius:9px;cursor:pointer}
.tab.on{background:var(--bg);color:var(--ink)}
.tab:focus-visible{outline:3px solid var(--accent)}
.statlist{display:grid;gap:6px}
.statlist h3{margin:10px 0 2px;font-family:Georgia,serif;font-size:1.05rem}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--surface);border-radius:10px}
.row span:first-child{color:var(--muted)}.row b{text-align:right}
.win{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.55);z-index:4;padding:20px}
.win .card{background:var(--surface);color:var(--ink);border-radius:20px;padding:28px 24px;max-width:380px;text-align:center;animation:winin .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes winin{from{transform:scale(.7);opacity:0}}
.win h2{font-family:Georgia,serif;font-size:1.8rem;margin:0 0 8px}
.win p{color:var(--muted);margin:0 0 18px}
.win button{background:var(--ok);color:var(--bg);border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.win button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.nm{align-items:center}
.padhint{position:fixed;left:50%;bottom:calc(10px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--surface);color:var(--ink);padding:6px 14px;border-radius:99px;font-size:.8rem;z-index:3;box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.pad .item.sel{outline:3px solid var(--accent);outline-offset:2px}
.item{--c:#8b8b80;border-left:6px solid var(--c);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,var(--surface)) var(--p,0%),var(--surface) var(--p,0%))}
.item:not(:disabled):hover{border-color:var(--c)}
.ic{width:2.4rem;height:2.4rem;display:grid;place-items:center;border-radius:50%;font-size:1.35rem;background:color-mix(in srgb,var(--c) 24%,transparent)}
.cost{color:color-mix(in srgb,var(--c) 70%,var(--ink))}
.own{position:absolute;top:-9px;left:-8px;z-index:1;background:var(--bg);color:color-mix(in srgb,var(--c) 70%,var(--ink));border:2px solid var(--c);border-radius:8px;padding:0 8px;font-size:.78rem;font-weight:700;line-height:1.4}
.own:empty{display:none}
.lvup{right:auto;left:58px;top:-8px;width:max-content;font-size:.85rem;line-height:1.4;color:color-mix(in srgb,var(--c) 70%,var(--ink));border:2px solid var(--c)}
.own.tick{animation:ownpop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes ownpop{0%{transform:scale(1.6);box-shadow:0 0 0 0 var(--c)}100%{transform:scale(1);box-shadow:0 0 0 8px transparent}}
.cost.tick{animation:costpop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes costpop{0%{transform:scale(1.3)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.own.tick,.cost.tick{animation:none}}
body{background-attachment:scroll}
.low .stage{box-shadow:none}.low #pz{filter:none!important}.low .item{transition:none}.low .lvup,.low .item.shine::after{display:none}
#lowbtn{right:60px;font-size:1.1rem}#lowbtn[aria-pressed="true"]{background:var(--ok);color:var(--bg)}
.item,.row,.count{contain:layout style}
#pilz{will-change:transform}
@media(max-width:759px){.stage{transform:translateZ(0)}.stagelbl{margin-top:12px}h1{text-align:left;padding-right:120px}.pop{text-shadow:none}}
.nm input{background:var(--bg);color:var(--ink);border:2px solid transparent;border-radius:8px;padding:6px 10px;font:inherit;width:9rem;text-align:right}
.nm input:focus-visible{outline:3px solid var(--accent)}
.row.me{box-shadow:inset 0 0 0 2px var(--ok)}
.row.king{background:linear-gradient(90deg,color-mix(in srgb,#e8b923 35%,var(--surface)),var(--surface));font-weight:700}
.item{position:relative}
.tick{animation:tick .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes tick{0%{transform:scale(1.5);color:var(--ok)}100%{transform:scale(1)}}
.lvup{position:absolute;right:14px;top:4px;font-weight:700;color:var(--ok);background:var(--bg);padding:2px 8px;border-radius:99px;pointer-events:none;z-index:2;animation:lvup .9s ease-out forwards}
@keyframes lvup{0%{transform:translateY(8px) scale(.5);opacity:0}25%{transform:translateY(-14px) scale(1.2);opacity:1}100%{transform:translateY(-34px) scale(1);opacity:0}}
.item.shine::after{content:"";position:absolute;inset:0;border-radius:10px;pointer-events:none;background:var(--c);animation:flash .45s ease-out forwards}
@keyframes flash{from{opacity:.35}to{opacity:0}}
@media(prefers-reduced-motion:reduce){.tick,.lvup,.item.shine::after{animation:none}}
html{-webkit-text-size-adjust:100%}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
#pilz{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
@media(max-width:759px){
 main{padding:10px 10px 30px;gap:12px}
 .stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;padding:10px 12px 14px;box-shadow:0 6px 14px rgba(0,0,0,.2)}
 h1{font-size:1.25rem;margin:0}
 .count{font-size:2.2rem}
 .rate{margin:0 0 6px;font-size:.9rem}
 .stats{display:none}
 #pilz{width:min(150px,38vw)}
 .mute{top:8px;right:8px;padding:10px 12px}
 .tab{padding:12px}
 .item{padding:12px}
}
@media(max-height:500px){#pilz{width:min(140px,40vh)}.stats{display:none}}
@keyframes bump{50%{transform:scale(1.08)}}
@media(prefers-reduced-motion:reduce){.count.bump{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="padhint" id="padhint" hidden>Ⓐ/✕ Ernten · ↑↓ Auswahl · Ⓧ/□ Kaufen · LB/RB Tabs · Ⓨ/△ Ton</div>
<div class="win" id="win" role="dialog" aria-modal="true" aria-labelledby="winH" hidden><div class="card"><h2 id="winH">🏆 Du hast gewonnen!</h2><p id="winTxt"></p><button id="winBtn">Weiterspielen</button></div></div>
<main>
<section class="stage" id="stage">
  <h1>Pilzfarm</h1>
  <button class="mute" id="mute" aria-label="Ton an/aus">🔊</button><button class="mute" id="lowbtn" aria-label="Sparmodus (weniger Effekte)" aria-pressed="false" title="Sparmodus">⚡</button>
  <div class="stagelbl" id="stg"></div>
  <div class="count"><span id="n">0</span></div>
  <div class="rate" id="rate"></div>
  <div class="stats"><div><b id="st1"></b><small>pro Klick</small></div><div><b id="st2"></b><small>Volltreffer</small></div><div><b id="st3"></b><small>insgesamt</small></div></div>
  <button id="pilz" aria-label="Pilz ernten">
    <svg id="pz" viewBox="0 0 200 200" width="100%" height="100%" aria-hidden="true">
      <path d="M70 120h60l-6 62a10 10 0 0 1-10 9H86a10 10 0 0 1-10-9z" fill="#e9dfc4"/>
      <path d="M12 118C12 58 52 16 100 16s88 42 88 102c0 8-6 12-14 12H26c-8 0-14-4-14-12z" fill="#b4432c"/>
      <circle cx="60" cy="68" r="13" fill="#f6efdc"/><circle cx="112" cy="46" r="9" fill="#f6efdc"/>
      <circle cx="146" cy="86" r="14" fill="#f6efdc"/><circle cx="92" cy="100" r="8" fill="#f6efdc"/>
    </svg>
  </button>
</section>
<section class="shop">
  <div class="tabs" role="tablist"><button class="tab on" id="tab1" role="tab" aria-selected="true">Ausbau</button><button class="tab" id="tab2" role="tab" aria-selected="false">Statistiken</button><button class="tab" id="tab3" role="tab" aria-selected="false">Rangliste</button></div>
  <div id="items" class="shop"></div>
  <div id="stats" class="statlist" hidden></div>
  <div id="board" class="statlist" hidden><div class="row nm"><span>Dein Name</span><input id="nm" maxlength="14" placeholder="Du" autocomplete="off" aria-label="Dein Name"></div><div id="rows" class="statlist"></div></div>
  <button class="reset" id="reset">Spielstand zurücksetzen</button>
</section>
</main>
<script>
const DEFS=[
 {id:"hand",name:"Bessere Handschuhe",desc:"+1 Pilz pro Klick",base:15,mult:1.5,click:1},
 {id:"korb",name:"Sammelkorb",desc:"+5 Pilze pro Klick",base:250,mult:1.6,click:5},
 {id:"kel",name:"Pilzkeller",desc:"+1 Pilz pro Sekunde",base:50,mult:1.15,sec:1},
 {id:"gew",name:"Gewächshaus",desc:"+8 Pilze pro Sekunde",base:500,mult:1.17,sec:8},
 {id:"lab",name:"Myzel-Labor",desc:"+50 Pilze pro Sekunde",base:4000,mult:1.2,sec:50},
 {id:"wald",name:"Zauberwald",desc:"+400 Pilze pro Sekunde",base:35000,mult:1.22,sec:400},
 {id:"glueck",name:"Glückspilz-Amulett",desc:"+2 % Volltreffer-Chance (max. 10×)",base:1000,mult:1.9,crit:.02,max:10},
 {id:"spat",name:"Goldener Spaten",desc:"+25 Pilze pro Klick",base:3000,mult:1.6,click:25},
 {id:"zh",name:"Zauberhandschuh",desc:"+150 Pilze pro Klick",base:40000,mult:1.7,click:150},
 {id:"fab",name:"Sporenfabrik",desc:"+2.500 Pilze pro Sekunde",base:300000,mult:1.23,sec:2500},
 {id:"reak",name:"Pilz-Reaktor",desc:"+15.000 Pilze pro Sekunde",base:2500000,mult:1.25,sec:15000},
 {id:"mond",name:"Mondgarten",desc:"+100.000 Pilze pro Sekunde",base:20000000,mult:1.27,sec:100000}
];
DEFS.sort((a,b)=>a.base-b.base);
const ICON={hand:"🧤",korb:"🧺",kel:"🕳️",gew:"🌱",lab:"🧪",wald:"🌲",glueck:"🍀",spat:"⛏️",zh:"✨",fab:"🏭",reak:"⚛️",mond:"🌙"};
const UCOL={hand:"#e07a2f",korb:"#b8863b",kel:"#8a6a4a",gew:"#3fa64f",glueck:"#1fa385",spat:"#e0b41f",lab:"#3aa6c9",wald:"#2f7d4f",zh:"#b05ad6",fab:"#8c96a3",reak:"#d43f6a",mond:"#5b6fd6"};
const critP=()=>.1+DEFS.reduce((a,d)=>a+(d.crit||0)*own(d),0);
const STG=[["Waldpilz","#c9533a","#a03420","#f6efdc","#e9dfc4",""],["Blauer Pilz","#5b8fd6","#2d5a9e","#e6f0ff","#e6e2d0",""],["Goldpilz","#f0c040","#c58a0f","#fff6c8","#efe3c0","#f0c040"],["Zauberpilz","#9b5fd0","#5e2a91","#f3dcff","#e8dcec","#b57bff"],["Kristallpilz","#4fd1e0","#1f8fa3","#e6fcff","#d5eef0","#4fd1e0"],["Glutpilz","#ffa21f","#d8321c","#fff0b3","#f3dfc0","#ff6a2a"],["Mondpilz","#4a5596","#1e2347","#fff6c0","#d9d6e8","#c9c4ff"],["Regenbogenpilz","#ff5fa2","#4aa8ff","#ffffff","#efe9ff","#ffd84a"],["Sternenpilz","#2b2f77","#0d0f33","#ffe9a8","#d7d4ea","#ffd84a"],["Urpilz","#00e5ff","#b100ff","#ffffff","#f0e6ff","#00e5ff"]];
const SPOTS=[[60,68,13],[112,46,9],[146,86,14],[92,100,8],[40,100,7],[130,60,6],[78,40,6]];
const level=()=>DEFS.reduce((a,d)=>a+own(d),0),stage=()=>Math.min(9,Math.floor(level()/10));
let drawn=-1;
function drawPilz(){const st=stage();if(st===drawn)return;const prev=drawn;drawn=st;
  const m=STG[st],n=4+Math.min(3,st>>1),z=$("pz");
  z.innerHTML='<defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+m[1]+'"/><stop offset="1" stop-color="'+m[2]+'"/></linearGradient></defs><path d="M70 120h60l-6 62a10 10 0 0 1-10 9H86a10 10 0 0 1-10-9z" fill="'+m[4]+'"/><path d="M12 118C12 58 52 16 100 16s88 42 88 102c0 8-6 12-14 12H26c-8 0-14-4-14-12z" fill="url(#cg)"/>'+SPOTS.slice(0,n).map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+p[2]+'" fill="'+m[3]+'"/>').join("");
  z.style.filter=m[5]?"drop-shadow(0 0 12px "+m[5]+")":"";
  if(prev>=0&&st>prev){const r=$("pilz").getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2,true);sfx.evolve();if(!rm)z.animate([{filter:"brightness(2.4)"},{filter:"brightness(1)"}],{duration:700})}}
let s={n:0,total:0,own:{}};
try{const r=localStorage.getItem("pilzfarm-v1");if(r)s=Object.assign(s,JSON.parse(r))}catch(e){}
const $=id=>document.getElementById(id);
const fmt=v=>v>=1e12?(v/1e12).toFixed(2).replace(".",",")+" Bio":v>=1e9?(v/1e9).toFixed(2).replace(".",",")+" Mrd":v>=1e6?(v/1e6).toFixed(2).replace(".",",")+" Mio":Math.floor(v).toLocaleString("de-DE");
const own=d=>s.own[d.id]||0;
const cost=d=>Math.ceil(d.base*Math.pow(d.mult,own(d)));
const perClick=()=>1+DEFS.reduce((a,d)=>a+(d.click||0)*own(d),0);
const perSec=()=>DEFS.reduce((a,d)=>a+(d.sec||0)*own(d),0);
const box=$("items");
const btns=DEFS.map(d=>{
  const b=document.createElement("button");b.className="item";
  b.innerHTML='<span class="ic">'+(ICON[d.id]||"🍄")+'</span><span class="tx"><b>'+d.name+'</b><small>'+d.desc+'</small></span><span class="rt"><span class="cost"></span><span class="own"></span></span>';
  b.onclick=()=>{const c=cost(d);if(s.n>=c&&!(d.max&&own(d)>=d.max)){s.n-=c;s.own[d.id]=own(d)+1;render();saveSoon();sfx.buy();if(!s.won&&d===DEFS[DEFS.length-1])win();const r=b.getBoundingClientRect(),uc=UCOL[d.id];burst(r.left+r.width/2,r.top+r.height/2,true,uc);
    b.animate([{transform:"scale(1.03)"},{transform:"scale(1)"}],{duration:300});
    b.classList.remove("shine");requestAnimationFrame(()=>{b.classList.add("shine");setTimeout(()=>b.classList.remove("shine"),450)});
    const old=b.querySelector(".lvup");if(old)old.remove();const lv=document.createElement("span");lv.className="lvup";lv.textContent="Lv "+own(d);b.appendChild(lv);setTimeout(()=>lv.remove(),900)}};
  box.appendChild(b);return b;
});
function render(){if(!rq)rq=low?setTimeout(()=>{rq=0;renderNow()},120):requestAnimationFrame(()=>{rq=0;renderNow()})}
let rq=0,booted=false,low=false;try{low=localStorage.getItem("pilzfarm-low")==="1"}catch(e){}setTimeout(()=>{booted=true},800);
function renderNow(){
  drawPilz();setX($("stg"),"Stufe "+(stage()+1)+" · "+STG[stage()][0]+" · "+(stage()>=9?"Maximale Stufe":(level()%10)+"/10 zur nächsten Stufe"));
  setX($("n"),fmt(s.n));renderStats();renderBoard();
  setT($("rate"),fmt(perSec())+" Pilze pro Sekunde");setT($("st1"),fmt(perClick()));setT($("st2"),Math.round(critP()*100)+" %");setX($("st3"),fmt(s.total));
  DEFS.forEach((d,i)=>{const b=btns[i],c=cost(d);
